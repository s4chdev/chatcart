<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marwar Crafts · ChatCart</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="chat-page">
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark">🛒</span>
      <div>
        <div class="brand-name">ChatCart</div>
        <div class="brand-sub">AI shop agent on PayPal · Marwar Crafts, Jodhpur</div>
      </div>
    </div>
    <div class="bar-right">
      <span id="modeBadge" class="mode-badge" title="Backend mode">…</span>
      <div class="view-toggle" role="group" aria-label="Layout">
        <button type="button" data-view="split" class="active">Chat + dashboard</button>
        <button type="button" data-view="chat">Chat only</button>
      </div>
      <a class="bar-link" href="/dashboard" target="_blank" rel="noopener">Open dashboard ↗</a>
    </div>
  </header>
  <div class="stripe"></div>

  <div id="layout" class="layout split">
    <main class="chat-pane">
      <div class="chat-head">
        <div class="avatar">🧵</div>
        <div class="title-block">
          <div class="shop-title">Marwar Crafts</div>
          <div class="shop-subtitle"><span class="dot"></span>Shop agent · replies instantly</div>
        </div>
        <button type="button" id="resetBtn" class="ghost-btn" title="Start a new chat">New chat</button>
      </div>

      <div id="chatLog" class="chat-log" aria-live="polite"></div>

      <div id="chipRow" class="chip-row"></div>

      <form id="chatForm" class="chat-input-bar" autocomplete="off">
        <input id="chatInput" type="text" placeholder="Ask for a gift, a bedsheet, a refund…" autocomplete="off" />
        <button type="submit" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg>
        </button>
      </form>
    </main>

    <section class="dash-pane" aria-label="Merchant dashboard">
      <span id="syncNote" class="sync-note">Dashboard updated</span>
      <iframe id="dashFrame" title="Merchant dashboard" src="about:blank"></iframe>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
